[project]
name = "video-catalogues-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pyotp>=2.10.0",
    "sqlalchemy>=2.1.5",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
